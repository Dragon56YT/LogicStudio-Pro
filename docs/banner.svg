<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.6"/>

  <!-- Circuito decorativo: puertas y cables -->
  <g fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round">
    <path d="M760 90 H800 M760 150 H800 M760 220 H800"/>
    <path d="M1000 120 H1060 M1000 200 H1060"/>
  </g>
  <g fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- AND -->
    <path d="M800 60 H840 a30 30 0 0 1 0 60 H800 Z"/>
    <!-- OR -->
    <path d="M800 130 q30 0 55 15 q-25 35 0 35 q-25 0 -55 0 q15 -25 0 -50 Z"/>
    <!-- XOR -->
    <path d="M800 190 q15 25 0 50 M815 190 q30 0 55 15 q-25 35 0 35 q-25 0 -55 0 q15 -25 0 -50"/>
  </g>
  <g fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round">
    <path d="M900 90 H1000 V120 M900 150 H1000 V120 M1000 200 V260 H940"/>
  </g>
  <circle cx="1000" cy="120" r="7" fill="#22d3ee"/>
  <rect x="1060" y="104" width="54" height="34" rx="6" fill="none" stroke="#22c55e" stroke-width="3"/>
  <circle cx="1140" cy="200" r="14" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <!-- Texto -->
  <text x="60" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#title)">LogicStudio Pro</text>
  <text x="62" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#cbd5e1">Simulador interactivo de electrónica digital · 1 a 64 bits</text>
  <rect x="62" y="210" width="150" height="40" rx="20" fill="#22d3ee" opacity="0.15" stroke="#22d3ee" stroke-width="2"/>
  <text x="137" y="237" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#22d3ee">Beta 0.4</text>
  <text x="62" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">by Alejandro Arbós Gómez</text>
</svg>
