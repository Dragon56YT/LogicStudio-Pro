<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <rect width="720" height="360" rx="16" fill="#0b1020"/>
  <g font-family="Consolas, monospace" font-size="20" fill="#cbd5e1">
    <text x="30" y="110">A</text>
    <text x="30" y="250">B</text>
    <text x="640" y="110">S (suma)</text>
    <text x="640" y="250">C (acarreo)</text>
  </g>
  <g fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- cables de entrada -->
    <path d="M60 100 H220 M60 240 H220"/>
    <path d="M220 130 V110 M220 230 V250"/>
    <!-- bifurcaciones -->
    <path d="M140 100 V150 H190 M140 240 V190 H190"/>
    <!-- XOR -->
    <path d="M300 100 q15 45 0 90 M315 100 H360 q40 0 40 45 q0 45 -40 45 H315 q15 -45 0 -90"/>
    <!-- AND -->
    <path d="M300 200 H340 a30 30 0 0 1 0 60 H300 Z"/>
    <!-- salidas -->
    <path d="M440 145 H600"/>
    <path d="M400 230 H600"/>
    <path d="M250 150 H300 M250 190 H300 M250 240 H300 M250 230 H300"/>
  </g>
  <circle cx="140" cy="100" r="6" fill="#a78bfa"/>
  <circle cx="140" cy="240" r="6" fill="#a78bfa"/>
  <circle cx="600" cy="145" r="10" fill="none" stroke="#22c55e" stroke-width="3"/>
  <circle cx="600" cy="230" r="10" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="360" y="335" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748b">Semisumador (half adder): S = A ⊕ B · C = A ∧ B</text>
</svg>
